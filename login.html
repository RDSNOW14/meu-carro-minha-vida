<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Meu Carro, Minha Vida</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">MEU CARRO, MINHA VIDA</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menu" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#catalogo">Carros</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#sobre">Sobre nós</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#contato">Contato</a></li>
                <li class="nav-item"><a class="nav-link active" href="login.html">Entrar</a></li>

                <li class="nav-item ms-lg-3">
                    <div class="acessibilidade">
                        <button type="button" class="btn btn-outline-light btn-sm"
                                id="diminuirFonte" aria-label="Diminuir fonte">A−</button>

                        <button type="button" class="btn btn-outline-light btn-sm"
                                id="aumentarFonte" aria-label="Aumentar fonte">A+</button>

                        <button type="button" class="btn btn-outline-warning btn-sm"
                                id="alternarContraste" aria-label="Alternar contraste">
                            Contraste
                        </button>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">

            <div class="text-center mb-4">
                <h1>Entrar</h1>
                <p>Acesse sua conta para continuar.</p>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <form id="formLogin">

                        <div class="mb-3">
                            <label for="loginEntrada" class="form-label">Login</label>
                            <input type="text" class="form-control" id="loginEntrada"
                                   placeholder="Digite seu login" maxlength="6" required>

                            <div class="form-text">
                                Digite o login de 6 letras usado no cadastro.
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="senhaEntrada" class="form-label">Senha</label>

                            <div class="input-group">
                                <input type="password" class="form-control" id="senhaEntrada"
                                       placeholder="Digite sua senha" maxlength="8" required>

                                <button type="button" class="btn btn-outline-secondary"
                                        id="mostrarSenhaEntrada">
                                    Mostrar
                                </button>
                            </div>

                            <div class="form-text">
                                Digite sua senha de 8 letras.
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-warning btn-lg">
                                Entrar
                            </button>
                        </div>

                        <div id="mensagemLoginEntrada" class="mt-3" role="alert"></div>

                    </form>

                </div>
            </div>

            <div class="text-center mt-3">
                <p>
                    Ainda não possui uma conta?
                    <a href="cadastro.html">Criar conta</a>
                </p>
            </div>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>

</body>
</html>
